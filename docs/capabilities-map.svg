<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1400" height="920" fill="#121220"/>
<defs><marker id="ah-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#fbbf24"/></marker></defs>
<defs><marker id="ah-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4ade80"/></marker></defs>
<defs><marker id="ah-sky" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#38bdf8"/></marker></defs>
<defs><marker id="ah-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c084fc"/></marker></defs>
<text x="700" y="64" font-size="34" fill="#e8eaf5" font-weight="bold" text-anchor="middle">The Capabilities Map — six capabilities, two loops</text>
<rect x="430" y="100" width="470" height="105" rx="14" fill="#2e1c42" stroke="#c084fc" stroke-width="3"/>
<text x="665.0" y="141" font-size="25" fill="#e8eaf5" font-weight="bold" text-anchor="middle">SELF-IMPROVEMENT</text>
<text x="665.0" y="183" font-size="19" fill="#a0a5be" font-weight="normal" text-anchor="middle">mines failures · proposes fixes + eval cases</text>
<rect x="430" y="285" width="470" height="123" rx="14" fill="#423218" stroke="#fbbf24" stroke-width="3"/>
<text x="665.0" y="326" font-size="25" fill="#e8eaf5" font-weight="bold" text-anchor="middle">EVALUATION — THE GATE</text>
<text x="665.0" y="368" font-size="19" fill="#a0a5be" font-weight="normal" text-anchor="middle">end-state · trajectory · pass^k</text>
<text x="665.0" y="395" font-size="19" fill="#a0a5be" font-weight="normal" text-anchor="middle">nothing ships unproven</text>
<line x1="665" y1="205" x2="665" y2="278" stroke="#fbbf24" stroke-width="4" marker-end="url(#ah-amber)"/>
<text x="682" y="250" font-size="18" fill="#fbbf24" font-weight="normal" text-anchor="middle">proposals</text>
<rect x="120" y="470" width="780" height="230" rx="14" fill="#1a1a2c" stroke="#f87171" stroke-width="3" stroke-dasharray="10 7"/>
<text x="144" y="502" font-size="20" fill="#f87171" font-weight="bold" text-anchor="start">GOVERNANCE — THE BOUNDARY</text>
<text x="144" y="527" font-size="17" fill="#a0a5be" font-weight="normal" text-anchor="start">gates · approval line · sandbox · budgets</text>
<rect x="150" y="545" width="310" height="120" rx="14" fill="#183a28" stroke="#4ade80" stroke-width="3"/>
<text x="305.0" y="586" font-size="25" fill="#e8eaf5" font-weight="bold" text-anchor="middle">RAG</text>
<text x="305.0" y="628" font-size="19" fill="#a0a5be" font-weight="normal" text-anchor="middle">cited facts on the desk</text>
<rect x="540" y="545" width="330" height="120" rx="14" fill="#1e3460" stroke="#6db3ff" stroke-width="3"/>
<text x="705.0" y="586" font-size="25" fill="#e8eaf5" font-weight="bold" text-anchor="middle">THE AGENT AT WORK</text>
<text x="705.0" y="628" font-size="19" fill="#a0a5be" font-weight="normal" text-anchor="middle">drafts · acts · replies</text>
<line x1="460" y1="605" x2="533" y2="605" stroke="#4ade80" stroke-width="4" marker-end="url(#ah-green)"/>
<text x="500" y="590" font-size="18" fill="#4ade80" font-weight="normal" text-anchor="middle">grounds</text>
<line x1="830" y1="408" x2="830" y2="538" stroke="#fbbf24" stroke-width="4" marker-end="url(#ah-amber)"/>
<text x="712" y="456" font-size="18" fill="#fbbf24" font-weight="normal" text-anchor="middle">only what passes ships</text>
<rect x="120" y="745" width="1210" height="100" rx="14" fill="#22222c" stroke="#9ca3af" stroke-width="3"/>
<text x="725.0" y="786" font-size="25" fill="#e8eaf5" font-weight="bold" text-anchor="middle">PRODUCTION — THE GROUND</text>
<text x="725.0" y="828" font-size="19" fill="#a0a5be" font-weight="normal" text-anchor="middle">durable execution · idempotent writes · cost per ticket capped</text>
<rect x="990" y="470" width="340" height="230" rx="14" fill="#163042" stroke="#38bdf8" stroke-width="3"/>
<text x="1160.0" y="511" font-size="25" fill="#e8eaf5" font-weight="bold" text-anchor="middle">OBSERVABILITY</text>
<text x="1160.0" y="553" font-size="19" fill="#a0a5be" font-weight="normal" text-anchor="middle">traces of every run</text>
<text x="1160.0" y="580" font-size="19" fill="#a0a5be" font-weight="normal" text-anchor="middle">error analysis on a cadence</text>
<line x1="900" y1="605" x2="983" y2="605" stroke="#38bdf8" stroke-width="4" marker-end="url(#ah-sky)"/>
<text x="945" y="590" font-size="18" fill="#38bdf8" font-weight="normal" text-anchor="middle">records</text>
<path d="M1160,470 L1160,152 L907,152" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#ah-purple)"/>
<text x="960" y="136" font-size="18" fill="#c084fc" font-weight="normal" text-anchor="start">traces feed the flywheel</text>
<text x="120" y="897" font-size="19" fill="#a0a5be" font-weight="normal" text-anchor="start">Run loop:  the agent acts — observability records.      Improvement loop:  traces → proposals → eval gate → agent.</text>
</svg>